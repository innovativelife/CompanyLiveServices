# This workflow automatically builds and deploys the .NET backend to Google Cloud Functions
# for PRs, pushes to staging, and pushes to main (production).
# Each environment uses separate projects and service accounts for security isolation.

name: Deploy Cloud Functions

# Define when this workflow should run
on:
  # Trigger on pull requests targeting the main branch (for PR preview functions)
  pull_request:
    branches:
      - main

  # Trigger on pushes to specific branches (for staging and production)
  push:
    branches:
      - main      # For production deployment
      - staging   # For staging deployment (adjust branch name if different)

  # Allow manual triggering from the GitHub UI for specific environments
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Select environment to deploy to:'
        required: true
        type: choice
        options:
          - pr       # Deploy to a PR-specific Cloud Function
          - staging  # Deploy to the staging Cloud Function
          - prod     # Deploy to the production Cloud Function
      pr_number:
        description: 'PR number (required for "pr" environment via manual trigger)'
        required: false
        type: number

# Global environment variables
env:
  REGION: 'australia-southeast1'                      # Cloud Functions region
  DEFAULT_FUNCTION_NAME: 'companyliveservices-2'      # Base name for your Cloud Function
  RUNTIME: 'dotnet8'
  ENTRY_POINT: 'InnovativeLife.WebApi.RequestHandler'
  SOURCE_DIR: './InnovativeLife'                      # Path to your .NET project source
  
  # Project IDs for each environment
  PR_PROJECT_ID: 'companylive-pr-sydney'
  STAGING_PROJECT_ID: 'companylive-staging-sydney'
  PROD_PROJECT_ID: 'companylive-c3879'

jobs:
  # Job to determine which environment we're deploying to
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      project_id: ${{ steps.determine.outputs.project_id }}
      function_name: ${{ steps.determine.outputs.function_name }}
    
    steps:
      - name: Determine deployment environment
        id: determine
        run: |
          # Logic for Pull Request builds
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=pr" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.PR_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          # Logic for Staging branch pushes
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.STAGING_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}-staging" >> $GITHUB_OUTPUT
          # Logic for Production (main branch) pushes
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}" >> $GITHUB_OUTPUT
          # Logic for Manual Trigger (workflow_dispatch)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.target_environment }}" in
              "pr")
                if [[ -z "${{ github.event.inputs.pr_number }}" ]]; then
                  echo "::error::Error: 'pr_number' input is required for 'pr' environment via manual trigger."
                  exit 1
                fi
                echo "environment=pr" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.PR_PROJECT_ID }}" >> $GITHUB_OUTPUT
                echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}-pr-${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
                ;;
              "staging")
                echo "environment=staging" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.STAGING_PROJECT_ID }}" >> $GITHUB_OUTPUT
                echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}-staging" >> $GITHUB_OUTPUT
                ;;
              "prod")
                echo "environment=production" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
                echo "function_name=${{ env.DEFAULT_FUNCTION_NAME }}" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "::error::Error: Invalid 'target_environment' input for manual trigger."
                exit 1
                ;;
            esac
          else
            echo "::error::Error: Unable to determine deployment environment."
            exit 1
          fi

  # PR deployments - no environment protection needed
  deploy-pr:
    if: needs.determine-environment.outputs.environment == 'pr'
    needs: determine-environment
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (PR)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PR_DEPLOYMENT_SERVICE_ACCOUNT }}  # PR-specific service account
          project_id: ${{ needs.determine-environment.outputs.project_id }}

      - name: Deploy to Cloud Function (PR)
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@v3
        with:
          project_id: ${{ needs.determine-environment.outputs.project_id }}
          region: ${{ env.REGION }}
          name: ${{ needs.determine-environment.outputs.function_name }}
          runtime: ${{ env.RUNTIME }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIR }}
          environment: GEN_2
          ingress_settings: ALLOW_ALL
          service_account: TODO
          environment_variables: |
            TENANT_ID=TODO
            PROJECT_ID=TODO
            
      - name: Make function publicly accessible (PR)
        run: |
          gcloud functions add-invoker-policy-binding ${{ needs.determine-environment.outputs.function_name }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --project=${{ needs.determine-environment.outputs.project_id }}
      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **PR Preview Deployed Successfully!**
              
              **Environment:** PR Preview
              **Project:** \`${{ needs.determine-environment.outputs.project_id }}\`
              **Function:** \`${{ needs.determine-environment.outputs.function_name }}\`
              **URL:** ${{ steps.deploy.outputs.url }}
              
              This preview will be available until the PR is closed.`
            })

      - name: Show deployment output (PR)
        run: |
          echo "PR Deployment successful!"
          echo "Deployed to Google Cloud Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Cloud Function Name: ${{ needs.determine-environment.outputs.function_name }}"
          echo "Cloud Function URL: ${{ steps.deploy.outputs.url }}"

  # Staging deployments - with staging environment protection
  deploy-staging:
    if: needs.determine-environment.outputs.environment == 'staging'
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: staging  # This enables environment protection rules in GitHub
    
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Staging)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_DEPLOYMENT_SERVICE_ACCOUNT }}  # Staging-specific service account
          project_id: ${{ needs.determine-environment.outputs.project_id }}

      - name: Deploy to Cloud Function (Staging)
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@v3
        with:
          project_id: ${{ needs.determine-environment.outputs.project_id }}
          region: ${{ env.REGION }}
          name: ${{ needs.determine-environment.outputs.function_name }}
          runtime: ${{ env.RUNTIME }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIR }}
          environment: GEN_2
          ingress_settings: ALLOW_ALL
          service_account: cloud-function-runtime@companylive-staging-sydney.iam.gserviceaccount.com
          environment_variables: |
            TENANT_ID=Root-8x3y3
            PROJECT_ID=companylive-staging-sydney
          
      - name: Make function publicly accessible (Staging)
        run: |
          gcloud functions add-invoker-policy-binding ${{ needs.determine-environment.outputs.function_name }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --project=${{ needs.determine-environment.outputs.project_id }}

      - name: Show deployment output (Staging)
        run: |
          echo "Staging Deployment successful!"
          echo "Deployed to Google Cloud Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Cloud Function Name: ${{ needs.determine-environment.outputs.function_name }}"
          echo "Cloud Function URL: ${{ steps.deploy.outputs.url }}"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Staging Release ${tag}`,
              body: `Automated staging deployment\n\n**Function URL:** ${{ steps.deploy.outputs.url }}`,
              draft: false,
              prerelease: false
            });

  # Production deployments - with production environment protection
  deploy-production:
    if: needs.determine-environment.outputs.environment == 'production'
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: production  # This enables environment protection rules in GitHub
    
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Production)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEPLOYMENTSERVICEACCOUNT }}  # Production-specific service account
          project_id: ${{ needs.determine-environment.outputs.project_id }}

      - name: Deploy to Cloud Function (Production)
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@v3
        with:
          project_id: ${{ needs.determine-environment.outputs.project_id }}
          region: ${{ env.REGION }}
          name: ${{ needs.determine-environment.outputs.function_name }}
          runtime: ${{ env.RUNTIME }}
          entry_point: ${{ env.ENTRY_POINT }}
          source_dir: ${{ env.SOURCE_DIR }}
          environment: GEN_2
          ingress_settings: ALLOW_ALL
          service_account: github-action-969928888@companylive-c3879.iam.gserviceaccount.com
          environment_variables: |
            TENANT_ID=Root-0ewfy
            PROJECT_ID=companylive-c3879

      - name: Make function publicly accessible (Production)
        run: |
          gcloud functions add-invoker-policy-binding ${{ needs.determine-environment.outputs.function_name }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --project=${{ needs.determine-environment.outputs.project_id }}
          
      - name: Show deployment output (Production)
        run: |
          echo "Production Deployment successful!"
          echo "Deployed to Google Cloud Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Cloud Function Name: ${{ needs.determine-environment.outputs.function_name }}"
          echo "Cloud Function URL: ${{ steps.deploy.outputs.url }}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Production Release ${tag}`,
              body: `Automated production deployment\n\n**Function URL:** ${{ steps.deploy.outputs.url }}`,
              draft: false,
              prerelease: false
            });
